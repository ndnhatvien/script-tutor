# Railway/Nixpacks configuration
# This tells Railway to build from script-tutor-backend folder

[phases.setup]
nixPkgs = ["python311", "tcl", "bash"]

[phases.install]
cmds = ["cd script-tutor-backend && pip install -r requirements.txt"]

[phases.build]
cmds = ["cd script-tutor-backend"]

[start]
cmd = "cd script-tutor-backend && uvicorn app:app --host 0.0.0.0 --port $PORT"
